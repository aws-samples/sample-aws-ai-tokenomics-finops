name: Site bug
description: Report a problem with the website itself, such as layout, navigation, links, or accessibility.
title: "[Site]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for problems with how the site works. For wrong or outdated content, use the **Content correction** form instead.
  - type: input
    id: page-url
    attributes:
      label: Page URL
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "e.g. Firefox 131 on Windows 11, Safari on iOS 18"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Paste or drag an image here.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I agree to follow the project's [Code of Conduct](https://aws.github.io/code-of-conduct).
          required: true
